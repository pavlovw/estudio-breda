# Configuración de publicación en Netlify
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  SANITY_PROJECT_ID = "4jx0qts1"
  SANITY_DATASET = "production"

# El panel (carpeta studio/) se publica aparte en Sanity: no afecta la compilación del sitio.

# Videos y texturas: guardarlos en caché del navegador por un buen tiempo
[[headers]]
  for = "/exposiciones/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/texturas/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
